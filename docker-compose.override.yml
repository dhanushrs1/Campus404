services:
  client:
    # Stop at the 'build' stage of the Dockerfile so we have a Node.js environment
    build:
      context: ./client
      target: build
    
    # Run the Vite development server for live-reloading
    command: npm run dev -- --host 0.0.0.0 --port 80
    
    # Map the local code into the container for instant updates
    volumes:
      - ./client:/app
      - /app/node_modules
    
    environment:
      - CHOKIDAR_USEPOLLING=true

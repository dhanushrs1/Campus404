# ============================================================================
# campus404 API Gateway (NGINX)
# ----------------------------------------------------------------------------
# Single browser entry point for the app.
#
# Responsibilities:
# 1. Forward frontend routes to the React/Vite service.
# 2. Forward /api, /auth, /uploads, and /health to FastAPI.
# 3. Keep SPA routing working for deep links such as /tracks and /admin/dashboard.
#
# Non-responsibilities:
# - No business logic
# - No code execution
# - No authentication decisions
# ============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # The API enforces per-file limits; this leaves room for multipart overhead.
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Docker service IPs can change when containers are recreated. Resolve
    # through Docker DNS at request time so the gateway does not keep a stale
    # upstream address and return temporary 502s after a rebuild/restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # React owns this path after OAuth finishes. Provider callbacks such as
        # /auth/google/callback and /auth/github/callback still go to FastAPI.
        location = /auth/callback {
            set $client_upstream http://client:80;
            proxy_pass $client_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_redirect off;
        }

        location = /auth/callback/ {
            return 301 /auth/callback$is_args$args;
        }

        # Backend API and uploaded assets. The regex deliberately handles both
        # the slash and no-slash forms: /api and /api/*, /auth and /auth/*,
        # /uploads and /uploads/*.
        location ~ ^/(api|auth|uploads)(/|$) {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_redirect off;
        }

        location = /health {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_redirect off;
        }

        location = /health/ {
            return 301 /health;
        }

        # Reserved private asset namespace. Public uploads are served through
        # /uploads above; private assets should never be web-accessible.
        location = /private-assets {
            return 403;
        }

        location /private-assets/ {
            return 403;
        }

        # Frontend SPA fallback for home, dashboard, tracks, workspace deep
        # links, admin deep links, and Vite HMR websocket traffic.
        location / {
            set $client_upstream http://client:80;
            proxy_pass $client_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_redirect off;
        }
    }
}
